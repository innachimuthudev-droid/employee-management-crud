<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Afterglow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { ink: '#090714', panel: '#151126', violet: '#9d5cff' } } } };
    </script>
    <style>
      :root { color-scheme: dark; } * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: #090714; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #f8f7ff; overflow-x: hidden; }
      .aurora { background: radial-gradient(circle at 15% 0%, rgba(92,57,255,.32), transparent 30%), radial-gradient(circle at 85% 15%, rgba(232,45,177,.22), transparent 28%), radial-gradient(circle at 55% 100%, rgba(0,211,255,.18), transparent 38%), #090714; }
      .grid-bg { background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 42px 42px; mask-image: linear-gradient(to bottom, black, transparent 76%); }
      .glass { background: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.045)); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 25px 80px rgba(0,0,0,.32), inset 0 1px rgba(255,255,255,.09); backdrop-filter: blur(20px); }
      .glow { box-shadow: 0 0 0 1px rgba(181,123,255,.28), 0 0 28px rgba(161,78,255,.38), 0 0 62px rgba(26,215,255,.12); }
      .gradient-text { background: linear-gradient(95deg,#fff 8%,#dcb7ff 35%,#ff83d5 62%,#65e6ff 92%); -webkit-background-clip:text; background-clip:text; color:transparent; }
      .confetti { position: fixed; width: 9px; height: 15px; top: -22px; border-radius: 3px; z-index: 60; animation: fall 3.5s linear forwards; }
      @keyframes fall { to { transform: translate3d(var(--x), 110vh, 0) rotate(740deg); opacity: 0; } }
      .photo-one { background: linear-gradient(145deg,#feceab,#f87fa7 47%,#752ec8); } .photo-two { background: linear-gradient(145deg,#79d8ff,#4e47ca 48%,#d24bdb); } .photo-three { background: linear-gradient(145deg,#ffe195,#ff8d63 48%,#db317e); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { useEffect, useMemo, useState } from 'https://esm.sh/react@18.3.1';
      import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
      import { AnimatePresence, motion } from 'https://esm.sh/framer-motion@11.3.19';
      import htm from 'https://esm.sh/htm@3.1.1';
      const html = htm.bind(React.createElement);

      const defaultSettings = { name: 'Avery', date: '', question: 'Where did we first meet?', answer: 'coffee shop', message: 'You make ordinary moments sparkle. Here’s to more late-night laughs, brave new dreams, and a year that feels completely yours.' };
      const fmt = n => String(n).padStart(2, '0');
      function Countdown({ date }) {
        const [left, setLeft] = useState(0);
        useEffect(() => { const target = date ? new Date(date).getTime() : Date.now() + 1000 * 60 * 60 * 24 * 12; const tick = () => setLeft(Math.max(0, target - Date.now())); tick(); const id = setInterval(tick, 1000); return () => clearInterval(id); }, [date]);
        const units = [[Math.floor(left / 86400000), 'days'], [Math.floor(left / 3600000) % 24, 'hours'], [Math.floor(left / 60000) % 60, 'mins'], [Math.floor(left / 1000) % 60, 'secs']];
        return html`<div className="grid grid-cols-4 gap-2 sm:gap-4">${units.map(([n, label]) => html`<div className="glass rounded-2xl px-2 py-4 text-center"><div className="text-2xl font-bold sm:text-4xl">${fmt(n)}</div><div className="mt-1 text-[10px] uppercase tracking-[.18em] text-violet-200/60">${label}</div></div>`)}</div>`;
      }
      function Settings({ settings, update, close }) { return html`<${motion.div} initial=${{opacity:0}} animate=${{opacity:1}} exit=${{opacity:0}} className="fixed inset-0 z-50 flex items-end bg-black/60 p-3 backdrop-blur-sm sm:items-center sm:justify-center"><${motion.form} initial=${{y:30,opacity:0}} animate=${{y:0,opacity:1}} exit=${{y:30,opacity:0}} onSubmit=${e=>{e.preventDefault();close()}} className="glass w-full max-w-xl rounded-3xl p-5 sm:p-7"><div className="mb-6 flex items-center justify-between"><div><p className="text-xs font-semibold uppercase tracking-[.24em] text-cyan-200">Creator studio</p><h2 className="mt-1 text-2xl font-bold">Customize the magic</h2></div><button onClick=${close} type="button" className="rounded-full bg-white/10 px-3 py-1 text-xl">×</button></div><div className="grid gap-4 sm:grid-cols-2"><${Field} label="Recipient name" value=${settings.name} onChange=${v=>update('name',v)} /><${Field} label="Birthday date" type="datetime-local" value=${settings.date} onChange=${v=>update('date',v)} /><${Field} label="Puzzle question" wide value=${settings.question} onChange=${v=>update('question',v)} /><${Field} label="Puzzle answer" value=${settings.answer} onChange=${v=>update('answer',v)} /><${Field} label="Secret message" wide multiline value=${settings.message} onChange=${v=>update('message',v)} /></div><button className="mt-6 w-full rounded-2xl bg-gradient-to-r from-violet-500 via-fuchsia-500 to-cyan-400 px-5 py-3 font-bold text-white shadow-lg shadow-fuchsia-700/30">Save your surprise</button></${motion.form}></${motion.div}>`; }
      function Field({label,value,onChange,type='text',wide,multiline}) { const common={value,onChange:e=>onChange(e.target.value),className:'mt-2 w-full rounded-xl border border-white/10 bg-black/25 px-3 py-3 text-sm outline-none transition focus:border-cyan-300/70 focus:ring-2 focus:ring-cyan-300/15'}; return html`<label className=${wide?'sm:col-span-2':''}><span className="text-xs font-medium text-white/65">${label}</span>${multiline?html`<textarea rows="3" ...${common}></textarea>`:html`<input type=${type} ...${common} />`}</label>`; }
      function Confetti() { const bits=useMemo(()=>Array.from({length:85},(_,i)=>({i,x:(Math.random()*100-50)+'vw',l:Math.random()*100+'%',d:Math.random()*1.4, c:['#a855f7','#ec4899','#22d3ee','#facc15','#fff'][i%5]})),[]); return html`<div>${bits.map(b=>html`<i className="confetti" style=${{'--x':b.x,left:b.l,background:b.c,animationDelay:b.d+'s'}}></i>`)}</div>`; }
      function App() {
        const [settings,setSettings]=useState(defaultSettings), [customizing,setCustomizing]=useState(false), [step,setStep]=useState(1), [guess,setGuess]=useState(''), [wrong,setWrong]=useState(false), [gift,setGift]=useState(false), [slide,setSlide]=useState(0);
        const update=(key,value)=>setSettings(s=>({...s,[key]:value})); const check=()=>{if(guess.trim().toLowerCase()===settings.answer.trim().toLowerCase()){setStep(3)}else {setWrong(true);setTimeout(()=>setWrong(false),520)}};
        const cards=[['photo-one','✨','Sunset adventures'],['photo-two','🎉','Your brightest era'],['photo-three','💌','More moments, please']];
        return html`<main className="aurora relative min-h-screen overflow-hidden"><div className="grid-bg pointer-events-none absolute inset-0"></div><nav className="relative z-10 mx-auto flex max-w-6xl items-center justify-between px-5 py-5 sm:px-8"><div className="flex items-center gap-3"><span className="grid h-10 w-10 place-items-center rounded-2xl bg-gradient-to-br from-violet-500 to-fuchsia-500 text-xl shadow-lg shadow-violet-500/40">✦</span><span className="text-sm font-bold tracking-wide">AFTERGLOW</span></div><button onClick=${()=>setCustomizing(true)} className="rounded-full border border-white/15 bg-white/5 px-4 py-2 text-sm font-semibold text-white/90 transition hover:border-cyan-300/70 hover:bg-white/10">⚙ Customize</button></nav><${AnimatePresence}>${customizing&&html`<${Settings} settings=${settings} update=${update} close=${()=>setCustomizing(false)} />`}</${AnimatePresence}><div className="relative z-10 mx-auto flex min-h-[calc(100vh-82px)] max-w-6xl items-center px-5 pb-16 sm:px-8"><${AnimatePresence} mode="wait">${step===1&&html`<${motion.section} key="one" initial=${{opacity:0,y:18}} animate=${{opacity:1,y:0}} exit=${{opacity:0,y:-18}} className="mx-auto w-full max-w-3xl text-center"><p className="mb-5 text-xs font-bold uppercase tracking-[.3em] text-cyan-200/80">A little something is waiting</p><h1 className="gradient-text text-5xl font-black leading-[.95] sm:text-7xl">The countdown<br/>to your magic.</h1><p className="mx-auto mt-6 max-w-lg text-base leading-7 text-white/65">A birthday experience made with love, memories, and one very special surprise.</p><div className="mx-auto mt-10 max-w-xl"><${Countdown} date=${settings.date}/></div><${motion.button} whileHover=${{scale:1.04}} whileTap=${{scale:.97}} onClick=${()=>setStep(2)} className="glow mt-10 rounded-2xl bg-gradient-to-r from-violet-500 via-fuchsia-500 to-cyan-400 px-8 py-4 text-base font-bold text-white">Start the surprise <span className="ml-2">→</span></${motion.button}></${motion.section>`}${step===2&&html`<${motion.section} key="two" initial=${{opacity:0,x:25}} animate=${{opacity:1,x:0}} exit=${{opacity:0,x:-25}} className="mx-auto w-full max-w-xl"><div className="glass rounded-[2rem] p-6 sm:p-10"><div className="mb-8 flex items-center gap-3"><span className="grid h-11 w-11 place-items-center rounded-2xl bg-fuchsia-500/20 text-xl">🔐</span><div><p className="text-xs uppercase tracking-[.24em] text-fuchsia-200/70">Secret checkpoint</p><p className="text-sm text-white/55">One answer unlocks it all.</p></div></div><h2 className="text-3xl font-bold leading-tight sm:text-4xl">${settings.question}</h2><p className="mt-3 text-sm text-white/55">Think of a memory only you two would know.</p><${motion.div} animate=${wrong?{x:[-10,10,-8,8,0]}:{x:0}} className=${'mt-8 rounded-2xl '+(wrong?'ring-2 ring-rose-400':'')}><input autoFocus value=${guess} onKeyDown=${e=>e.key==='Enter'&&check()} onChange=${e=>setGuess(e.target.value)} placeholder="Type your answer..." className="w-full rounded-2xl border border-white/12 bg-black/30 px-5 py-4 outline-none transition placeholder:text-white/30 focus:border-cyan-300 focus:ring-4 focus:ring-cyan-300/10"/></${motion.div}>${wrong&&html`<p className="mt-3 text-sm text-rose-300">Not quite — try that memory again.</p>`}<button onClick=${check} className="mt-6 w-full rounded-2xl bg-white px-5 py-4 font-bold text-[#171026] transition hover:bg-cyan-100">Unlock the reveal ✨</button><button onClick=${()=>setStep(1)} className="mt-4 w-full text-sm text-white/45">← Back to countdown</button></div></${motion.section>`}${step===3&&html`<${motion.section} key="three" initial=${{opacity:0,scale:.97}} animate=${{opacity:1,scale:1}} className="mx-auto w-full max-w-5xl py-4 text-center"><${Confetti}/><p className="text-xs font-bold uppercase tracking-[.32em] text-cyan-200/80">The moment is yours</p><h1 className="gradient-text mt-3 text-5xl font-black leading-none sm:text-7xl">Happy Birthday,<br/>${settings.name}!</h1><div className="glass mx-auto mt-7 max-w-2xl rounded-3xl p-6 sm:p-8"><span className="text-3xl">✦</span><p className="mt-3 text-lg leading-8 text-white/85">${settings.message}</p></div><div className="mt-8 flex items-center justify-center gap-3"><button onClick=${()=>setSlide((slide+2)%3)} className="grid h-10 w-10 place-items-center rounded-full border border-white/15 bg-white/10">←</button><${motion.div} key=${slide} initial=${{opacity:0,x:20}} animate=${{opacity:1,x:0}} className=${cards[slide][0]+' relative h-44 w-64 overflow-hidden rounded-3xl shadow-2xl sm:h-52 sm:w-80'}><div className="absolute inset-0 bg-gradient-to-t from-black/65 via-transparent"></div><span className="absolute left-6 top-7 text-5xl">${cards[slide][1]}</span><p className="absolute bottom-5 left-6 font-bold">${cards[slide][2]}</p></${motion.div}><button onClick=${()=>setSlide((slide+1)%3)} className="grid h-10 w-10 place-items-center rounded-full border border-white/15 bg-white/10">→</button></div><p className="mt-3 text-xs text-white/45">A little carousel of favorite feelings · ${slide+1}/3</p><button onClick=${()=>setGift(true)} className="glow mt-8 rounded-2xl bg-gradient-to-r from-violet-500 to-fuchsia-500 px-7 py-4 font-bold">Unwrap final gift 🎁</button></${motion.section>`}</${AnimatePresence}></div><${AnimatePresence}>${gift&&html`<${motion.div} initial=${{opacity:0}} animate=${{opacity:1}} exit=${{opacity:0}} className="fixed inset-0 z-50 grid place-items-center bg-black/65 p-5 backdrop-blur-md"><${motion.div} initial=${{scale:.8,y:20}} animate=${{scale:1,y:0}} className="glass max-w-md rounded-[2rem] p-8 text-center"><div className="text-5xl">🎁</div><p className="mt-5 text-xs font-bold uppercase tracking-[.25em] text-fuchsia-200">Your final gift</p><p className="mt-4 text-xl font-semibold leading-8">${settings.message}</p><button onClick=${()=>setGift(false)} className="mt-7 rounded-xl bg-white px-6 py-3 font-bold text-[#171026]">Keep this close</button></${motion.div}></${motion.div>`}</${AnimatePresence}></main>`;
      }
      createRoot(document.getElementById('root')).render(html`<${App} />`);
    </script>
  </body>
</html>
